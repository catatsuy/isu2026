# Include in the existing server {}. Keep the previous cache location during rollout.
location ^~ /_internal/image-files/ {
    internal;
    alias /home/isucon/image-files/;
    sendfile on;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;
}

# All reads/writes authenticate in Go with a timestamped HMAC.
location ^~ /internal/image-files/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_request_buffering off;
    proxy_cache off;
}
