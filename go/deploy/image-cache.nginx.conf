# Include inside the existing application's server {} on each regional server.
# Must match ISUREAL_IMAGE_CACHE_DIR. Go must be able to write this directory;
# nginx must be able to traverse its parents and read the files.
location ^~ /_internal/images/ {
    internal;
    alias /home/isucon/image-cache/;
    sendfile on;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;
}
